# Testy, a potem obraz Dockera dla linux/amd64 i linux/arm64 w GitHub Container Registry.
#
# - push do main: obraz :main, :latest i :sha-<skrót>
# - tag v1.2.3:   obraz :1.2.3, :1.2 i :latest
# - pull request: tylko testy i próbny build (nic nie jest publikowane)
name: Obraz Dockera

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Testy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gamelogg
          POSTGRES_PASSWORD: gamelogg-test
          POSTGRES_DB: gamelogg_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gamelogg -d gamelogg_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Frontend
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Go vet
        run: go vet ./...

      - name: Go test (z testami integracyjnymi na Postgresie)
        env:
          TEST_DATABASE_URL: postgres://gamelogg:gamelogg-test@localhost:5433/gamelogg_test?sslmode=disable
        run: go test -count=1 ./...

  image:
    name: Obraz
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe potrzebuje tagów

      - name: Nazwa obrazu i wersja
        id: vars
        run: |
          # Nazwy w GHCR muszą być małymi literami (repozytorium to GameLogg).
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Tagi i etykiety
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=GameLogg
            org.opencontainers.image.description=Self-hosted tracker gier, filmów, seriali i anime

      - uses: docker/setup-buildx-action@v3

      - name: Logowanie do GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Budowa i publikacja
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: VERSION=${{ steps.vars.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
