<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>GameLogg — Szukaj</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1B1923}
a{color:#EEEAF4}a:hover{color:#7FD8BE}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid #7FD8BE;outline-offset:3px}
.nav a{text-decoration:none;color:#A49DB2;padding:10px 14px;border-radius:8px;min-height:44px;display:inline-flex;align-items:center}
.nav a:hover{color:#EEEAF4;background:#24212E}
.tabs button{border:0;background:transparent;color:#A49DB2;padding:0 4px;min-height:44px;cursor:pointer;font-weight:600;border-bottom:3px solid transparent;border-radius:0}
.tabs button[aria-pressed="true"]{color:#EEEAF4;border-bottom-color:#7FD8BE}
.row:hover{background:#24212E}
</style>
</helmet>
<div style="min-height:1060px;background:#1B1923;color:#EEEAF4;font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.5">

<header style="display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px;padding:18px 40px;border-bottom:1px solid #2C2937">
<a href="Home.dc.html" style="text-decoration:none;font-size:26px;font-weight:800;font-stretch:125%;letter-spacing:-0.02em;color:#EEEAF4">gamelogg</a>
<nav class="nav" aria-label="Główna" style="display:flex;flex-wrap:wrap;gap:4px;flex:1 1 auto">
<a href="Home.dc.html">Odkryj</a>
<a href="Main.dc.html">Biblioteka</a>
<a href="Media.dc.html">Filmy i seriale</a>
<a href="Multiplayer.dc.html">Multiplayer</a>
</nav>
<a href="Profile.dc.html" aria-label="Profil: Bartek" style="width:44px;height:44px;border-radius:50%;border:1px solid #34303F;background:#2C2937;font-weight:700;display:inline-flex;align-items:center;justify-content:center;text-decoration:none">B</a>
</header>

<main style="max-width:1040px;margin:0 auto;padding:48px 40px 72px">
<label for="q" style="display:block;font-size:44px;line-height:1.05;font-weight:850;font-stretch:118%;letter-spacing:-0.02em;margin-bottom:22px">Czego szukasz?</label>
<div style="display:flex;align-items:center;gap:14px;background:#24212E;border:2px solid #46415A;border-radius:14px;padding:0 20px;min-height:64px">
<svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="#A49DB2" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"></circle><path d="M11 11l3.5 3.5"></path></svg>
<input id="q" type="search" value="{{q}}" onChange="{{noop}}" style="border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:22px;font-weight:600;color:#EEEAF4">
<span style="color:#A49DB2;font-size:14px">{{count}} wyników</span>
</div>

<div class="tabs" role="group" aria-label="Szukaj w" style="display:flex;gap:24px;margin:24px 0 8px;border-bottom:1px solid #2C2937">
<button aria-pressed="{{isGames}}" onClick="{{toGames}}">Gry, z IGDB</button>
<button aria-pressed="{{isMedia}}" onClick="{{toMedia}}">Filmy, seriale i anime, z TMDB i MyAnimeList</button>
</div>

<ol style="list-style:none;margin:0;padding:0">
<sc-for list="{{results}}" as="r" hint-placeholder-count="5">
<li class="row" style="display:flex;align-items:center;gap:20px;padding:14px 12px;border-radius:12px;border-bottom:1px solid #24212E">
<div style="{{r.thumb}}"></div>
<div style="flex:1;min-width:0">
<div style="font-size:18px;font-weight:750;line-height:1.25">{{r.t}}</div>
<div style="color:#A49DB2;font-size:14px;margin-top:2px">{{r.meta}}</div>
<div style="color:#8A8398;font-size:13px;margin-top:2px">{{r.extra}}</div>
</div>
<div style="width:90px;text-align:right">
<div style="font-size:22px;font-weight:850;font-stretch:110%;font-variant-numeric:tabular-nums">{{r.score}}</div>
<div style="color:#8A8398;font-size:12px">{{r.src}}</div>
</div>
<div style="width:200px;display:flex;justify-content:flex-end">
<sc-if value="{{r.owned}}" hint-placeholder-val="{{ false }}">
<a href="{{r.href}}" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:10px;background:#24212E;border:1px solid #34303F;text-decoration:none;font-size:14px;font-weight:600"><span aria-hidden="true" style="{{r.dot}}"></span>{{r.ownedLabel}}</a>
</sc-if>
<sc-if value="{{r.notOwned}}" hint-placeholder-val="{{ true }}">
<a href="AddGame.dc.html" style="display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:10px;background:#7FD8BE;color:#14231E;text-decoration:none;font-weight:700">{{addLabel}}</a>
</sc-if>
</div>
</li>
</sc-for>
</ol>
<p style="margin:28px 0 0;color:#8A8398;font-size:14px">{{foot}}</p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1060}}'>
function cov(c1,c2,pat){
  if(pat==="split") return "linear-gradient(160deg,"+c1+" 0 56%,"+c2+" 56% 100%)";
  if(pat==="disc") return "radial-gradient(circle at 50% 36%,"+c2+" 0 27%,"+c1+" 27.5% 100%)";
  if(pat==="bands") return "repeating-linear-gradient(0deg,"+c1+" 0 10px,"+c2+" 10px 12px)";
  return "linear-gradient(135deg,"+c2+" 0 32%,"+c1+" 32% 100%)";
}
var GAMES=[
{t:"Persona 5 Royal",meta:"2020, Atlus",extra:"PC, PS4, PS5, Xbox, Switch",score:"92",own:["Ukończone","#F2C14E"],c:["#B8232A","#141414","corner"]},
{t:"Persona 3 Reload",meta:"2024, Atlus",extra:"PC, PS4, PS5, Xbox",score:"88",c:["#1F4E9A","#9FD3F2","disc"]},
{t:"Persona 4 Golden",meta:"2012, Atlus",extra:"PC, PS Vita, PS4, Xbox, Switch",score:"91",c:["#F2C230","#2A2A2A","bands"]},
{t:"Persona 5 Tactica",meta:"2023, Atlus",extra:"PC, PS4, PS5, Xbox, Switch",score:"78",c:["#D9353B","#F1E6E0","split"]},
{t:"Persona 5 Strikers",meta:"2020, Omega Force",extra:"PC, PS4, Switch",score:"80",c:["#2C2C34","#E3363E","bands"]}
];
var MEDIA=[
{t:"Diuna: Część druga",meta:"Film, 2024, Denis Villeneuve",extra:"2 h 46 min",score:"92",own:["Do obejrzenia","#8EA8FF"],c:["#C78A4A","#3A2416","split"]},
{t:"Diuna",meta:"Film, 2021, Denis Villeneuve",extra:"2 h 35 min",score:"83",c:["#3A2E26","#D9A066","disc"]},
{t:"Diuna: Proroctwo",meta:"Serial, 2024, Diane Ademu-John",extra:"6 odcinków",score:"74",c:["#1E1A18","#B88C55","bands"]},
{t:"Diuna",meta:"Film, 1984, David Lynch",extra:"2 h 17 min",score:"58",c:["#5A3A6B","#E2A54A","corner"]}
];
class Component extends DCLogic {
  constructor(p){super(p);this.state={tab:"games"};}
  renderVals(){
    var self=this, g=this.state.tab==="games", src=g?GAMES:MEDIA;
    return {
      q:g?"persona":"diuna",
      isGames:g,isMedia:!g,
      toGames:function(){self.setState({tab:"games"});},
      toMedia:function(){self.setState({tab:"media"});},
      noop:function(){},
      count:src.length,
      addLabel:g?"Dodaj na półkę":"Dodaj do listy",
      foot:g?"Nie ma tego, czego szukasz? IGDB zna głównie wydane gry i zapowiedzi z datą.":"Filmy i seriale pochodzą z TMDB, anime z MyAnimeList.",
      results:src.map(function(r){return Object.assign({},r,{
        thumb:"flex:0 0 54px;height:72px;border-radius:5px;background:"+cov(r.c[0],r.c[1],r.c[2])+";box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)",
        owned:!!r.own, notOwned:!r.own,
        ownedLabel:r.own?"Na półce: "+r.own[0]:"",
        dot:r.own?"width:8px;height:8px;border-radius:2px;background:"+r.own[1]:"",
        href:g?"Main.dc.html":"Media.dc.html",
        src:g?"IGDB":"TMDB"
      });})
    };
  }
}
</script>
</body>
</html>
