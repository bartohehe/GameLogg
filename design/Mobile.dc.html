<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>GameLogg — Biblioteka na telefonie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1B1923}
a{color:#EEEAF4}a:hover{color:#7FD8BE}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #7FD8BE;outline-offset:2px}
.chip{flex:0 0 auto;border:1px solid #34303F;background:#24212E;border-radius:999px;min-height:40px;padding:0 14px 0 11px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:#CFC8DB;font-size:14px}
.chip[aria-pressed="true"]{background:#EEEAF4;border-color:#EEEAF4;color:#1B1923;font-weight:700}
.sp{border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:space-between;border-radius:3px 3px 1px 1px;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.sp[aria-pressed="true"]{transform:translateY(-10px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#A49DB2;font-size:11px;min-height:56px}
.tab[aria-current="page"]{color:#EEEAF4;font-weight:700}
.chips::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){.sp{transition:none}}
</style>
</helmet>
<div style="width:390px;height:844px;background:#1B1923;color:#EEEAF4;font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden;position:relative">

<div style="padding:22px 16px 0;display:flex;justify-content:space-between;align-items:center">
<h1 style="margin:0;font-size:32px;font-weight:850;font-stretch:118%;letter-spacing:-0.02em">Biblioteka</h1>
<button aria-label="Dodaj grę" style="width:44px;height:44px;border-radius:12px;border:0;background:#7FD8BE;display:inline-flex;align-items:center;justify-content:center;cursor:pointer"><svg width="16" height="16" viewBox="0 0 16 16" stroke="#14231E" stroke-width="2" aria-hidden="true"><path d="M8 2v12M2 8h12"></path></svg></button>
</div>

<div class="chips" role="group" aria-label="Półka" style="display:flex;gap:8px;overflow-x:auto;padding:16px 16px 4px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button class="chip" aria-pressed="{{c.on}}" onClick="{{c.pick}}"><span aria-hidden="true" style="{{c.dot}}"></span>{{c.label}} <span style="opacity:.7;font-variant-numeric:tabular-nums">{{c.n}}</span></button>
</sc-for>
</div>

<div style="flex:1;overflow-y:auto;padding:8px 16px 200px">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="2">
<div style="margin-top:14px">
<div style="display:flex;align-items:flex-end;gap:4px;padding:12px 6px 0;min-height:184px">
<sc-for list="{{row}}" as="g" hint-placeholder-count="8">
<button class="sp" aria-pressed="{{g.selected}}" aria-label="{{g.aria}}" onClick="{{g.pick}}" style="{{g.style}}">
<span aria-hidden="true" style="{{g.band}}"></span>
<span style="writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:700;font-stretch:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:104px;flex:1;padding:6px 0">{{g.t}}</span>
<span style="font-size:11px;font-weight:800;margin-bottom:6px;min-height:14px">{{g.scoreText}}</span>
</button>
</sc-for>
</div>
<div aria-hidden="true" style="height:10px;background:#34303F;border-radius:2px;box-shadow:inset 0 2px 0 #46415A,0 6px 10px -4px rgba(0,0,0,.6)"></div>
</div>
</sc-for>
</div>

<div style="position:absolute;left:8px;right:8px;bottom:72px;background:#24212E;border:1px solid #34303F;border-radius:18px;padding:12px 14px 14px;box-shadow:0 -10px 30px rgba(0,0,0,.35)">
<div aria-hidden="true" style="width:36px;height:4px;border-radius:2px;background:#46415A;margin:0 auto 10px"></div>
<div style="display:flex;gap:14px;align-items:center">
<div style="{{sel.thumb}}"></div>
<div style="flex:1;min-width:0">
<div style="font-weight:800;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{sel.t}}</div>
<div style="display:flex;align-items:center;gap:6px;color:#A49DB2;font-size:13px;margin-top:2px"><span aria-hidden="true" style="{{sel.dot}}"></span>{{sel.statusLabel}} na {{sel.p}}</div>
</div>
<div style="font-size:34px;line-height:1;font-weight:900;font-stretch:115%;color:#F2C14E;font-variant-numeric:tabular-nums">{{sel.scoreText}}</div>
</div>
<a href="Game.dc.html" style="margin-top:12px;display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;border:1px solid #46415A;text-decoration:none;font-weight:650">Otwórz kartę gry</a>
</div>

<nav aria-label="Główna" style="position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;background:#16141C;border-top:1px solid #2C2937;padding:0 8px">
<a class="tab" href="Home.dc.html"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M10 2l2.4 5.6L18 10l-5.6 2.4L10 18l-2.4-5.6L2 10l5.6-2.4z"></path></svg>Odkryj</a>
<a class="tab" href="#" aria-current="page"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 3v13M7 5v11M11 3v13M14 6l3 10M2 17h16"></path></svg>Biblioteka</a>
<a class="tab" href="Search.dc.html"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="9" cy="9" r="6"></circle><path d="M13.5 13.5L18 18"></path></svg>Szukaj</a>
<a class="tab" href="Profile.dc.html"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="7" r="3.5"></circle><path d="M3 18c0-3.9 3.1-7 7-7s7 3.1 7 7"></path></svg>Profil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var GAMES=[
{id:1,t:"Hollow Knight: Silksong",s:"InProgress",p:"PC",c1:"#2B2F4A",c2:"#C9474F",ink:"#F1ECE4"},
{id:2,t:"Clair Obscur: Expedition 33",s:"InProgress",p:"PS5",c1:"#E3D6BF",c2:"#8C2F39",ink:"#2A1E1A"},
{id:3,t:"Kingdom Come: Deliverance II",s:"InProgress",p:"PC",c1:"#3E4A2F",c2:"#C8A24A",ink:"#F3EEDD"},

{id:8,t:"Split Fiction",s:"Planned",p:"PS5",c1:"#5E7CE2",c2:"#F4B33E",ink:"#10142A"},
{id:9,t:"Monster Hunter Wilds",s:"Planned",p:"PC",c1:"#5A4632",c2:"#E0B070",ink:"#F5EBDB"},
{id:10,t:"Outer Wilds",s:"Planned",p:"PC",c1:"#20305A",c2:"#F08A3E",ink:"#F3EEE6"},
{id:11,t:"Baldur's Gate 3",s:"Completed",p:"PC",sc:96,c1:"#2A2140",c2:"#C9A04B",ink:"#F1E9D6"},
{id:12,t:"Elden Ring",s:"Completed",p:"PS5",sc:94,c1:"#2E2A22",c2:"#D7B55B",ink:"#EFE6CF"},
{id:13,t:"Disco Elysium",s:"Completed",p:"PC",sc:92,c1:"#C65B3E",c2:"#2E3B4E",ink:"#FFF1E6"},
{id:14,t:"Red Dead Redemption 2",s:"Completed",p:"PS5",sc:91,c1:"#8E2B22",c2:"#E8DCC4",ink:"#FBF2E2"},
{id:15,t:"Persona 5 Royal",s:"Completed",p:"NSW",sc:90,c1:"#B8232A",c2:"#141414",ink:"#FFFFFF"},
{id:16,t:"Celeste",s:"Completed",p:"NSW",sc:89,c1:"#3A2D6B",c2:"#E86A8E",ink:"#F6EEFF"},
{id:17,t:"Balatro",s:"Completed",p:"PC",sc:88,c1:"#2E6B57",c2:"#E2403C",ink:"#F4FFF9"},
{id:18,t:"Alan Wake 2",s:"Completed",p:"PS5",sc:87,c1:"#15191E",c2:"#B83A2E",ink:"#E7E3DC"},
{id:19,t:"Astro Bot",s:"Completed",p:"PS5",sc:86,c1:"#DDE6F2",c2:"#2F6BD8",ink:"#14203A"},
{id:20,t:"Cyberpunk 2077",s:"Completed",p:"PC",sc:85,c1:"#F2E64A",c2:"#1C1C24",ink:"#18181F"},
{id:21,t:"Stardew Valley",s:"Completed",p:"NSW",sc:84,c1:"#8FBCE6",c2:"#4E8A3A",ink:"#0F2233"},
{id:22,t:"Hi-Fi Rush",s:"Completed",p:"XBOX",sc:82,c1:"#F4A3C0",c2:"#2B2B6E",ink:"#24123A"},
{id:23,t:"Gran Turismo 7",s:"Completed",p:"PS5",sc:78,c1:"#E9ECEF",c2:"#1E3F8C",ink:"#0F1C3D"},

{id:26,t:"Factorio",s:"OnHold",p:"PC",c1:"#4A4136",c2:"#E08A2E",ink:"#F3EADB"},
{id:27,t:"Grand Theft Auto VI",s:"Wishlist",p:"PS5",c1:"#E8608A",c2:"#2BB3C0",ink:"#1F0F18"},
{id:28,t:"Ghost of Yōtei",s:"Wishlist",p:"PS5",c1:"#EDE6DA",c2:"#A3262A",ink:"#2A1A16"},
{id:29,t:"Starfield",s:"Abandoned",p:"XBOX",sc:61,c1:"#1B2233",c2:"#C7CED9",ink:"#E6EAF0"},
{id:30,t:"Skull and Bones",s:"Abandoned",p:"PC",sc:40,c1:"#2F2A24",c2:"#8A7650",ink:"#E9E1D2"}
];
var STATUS={InProgress:["W trakcie","#7FD8BE"],Planned:["Planowane","#8EA8FF"],Completed:["Ukończone","#F2C14E"],OnHold:["Wstrzymane","#F0935A"],Wishlist:["Lista życzeń","#F28DBA"],Abandoned:["Porzucone","#8A8398"]};
var ORDER=["Completed","InProgress","Planned","OnHold","Wishlist","Abandoned"];
class Component extends DCLogic {
  constructor(p){super(p);this.state={f:"Completed",sel:12};}
  renderVals(){
    var self=this, st=this.state;
    var gs=GAMES.filter(function(g){return g.s===st.f;});
    var items=gs.map(function(g){
      var h=g.p==="NSW"?150:(g.p==="PC"?162:172);
      return Object.assign({},g,{
        selected:g.id===st.sel, pick:function(){self.setState({sel:g.id});},
        aria:g.t+(g.sc?", ocena "+g.sc:""), scoreText:g.sc?String(g.sc):"",
        style:"width:38px;height:"+h+"px;flex:0 0 auto;color:"+g.ink+";background:linear-gradient(90deg,"+g.c1+" 0 80%,"+g.c2+" 80% 100%)",
        band:"display:block;width:100%;height:6px;border-radius:3px 3px 0 0;background:"+STATUS[g.s][1]
      });
    });
    var rows=[]; for(var i=0;i<items.length;i+=8) rows.push(items.slice(i,i+8));
    var g=GAMES.find(function(x){return x.id===st.sel;});
    if(!g||g.s!==st.f){g=gs[0];}
    var sel={t:g.t,p:g.p,scoreText:g.sc?String(g.sc):"",statusLabel:STATUS[g.s][0],dot:"width:8px;height:8px;border-radius:2px;background:"+STATUS[g.s][1],thumb:"flex:0 0 42px;height:56px;border-radius:4px;background:linear-gradient(160deg,"+g.c1+" 0 56%,"+g.c2+" 56% 100%)"};
    return {
      rows:rows, sel:sel,
      chips:ORDER.map(function(k){return {label:STATUS[k][0],n:GAMES.filter(function(x){return x.s===k;}).length,on:k===st.f,dot:"width:8px;height:8px;border-radius:2px;background:"+STATUS[k][1],pick:function(){var first=GAMES.find(function(x){return x.s===k;});self.setState({f:k,sel:first?first.id:0});}};})
    };
  }
}
</script>
</body>
</html>
