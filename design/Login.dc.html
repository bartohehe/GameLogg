<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>GameLogg — Logowanie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1B1923}
a{color:#EEEAF4}a:hover{color:#7FD8BE}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid #7FD8BE;outline-offset:3px}
.tab{flex:1;border:0;background:transparent;color:#A49DB2;min-height:44px;border-radius:8px;cursor:pointer;font-weight:600}
.tab[aria-pressed="true"]{background:#EEEAF4;color:#1B1923;font-weight:700}
.fld{display:block;width:100%;background:#1B1923;border:1px solid #46415A;border-radius:10px;padding:0 14px;min-height:48px;color:#EEEAF4;margin-top:6px}
.fld:focus{border-color:#7FD8BE;outline:none}
</style>
</helmet>
<div style="min-height:900px;background:#1B1923;color:#EEEAF4;font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.5;display:flex;flex-wrap:wrap">

<div style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:56px 56px 0;overflow:hidden">
<div>
<div style="font-size:88px;line-height:.9;font-weight:900;font-stretch:125%;letter-spacing:-0.04em">gamelogg</div>
<p style="margin:20px 0 0;font-size:22px;color:#CFC8DB;max-width:28ch">Twoje gry na jednej półce, na twoim własnym serwerze.</p>
</div>
<div aria-hidden="true" style="margin-top:48px">
<div style="display:flex;align-items:flex-end;gap:5px;padding:0 10px">
<sc-for list="{{spines}}" as="s" hint-placeholder-count="20"><span style="{{s}}"></span></sc-for>
</div>
<div style="height:14px;background:#34303F;border-radius:2px;box-shadow:inset 0 2px 0 #46415A"></div>
<div style="height:56px"></div>
</div>
</div>

<div style="flex:1 1 440px;display:flex;align-items:center;justify-content:center;padding:48px 40px;background:#24212E;border-left:1px solid #2C2937">
<div style="width:100%;max-width:380px">
<div role="group" aria-label="Formularz" style="display:flex;gap:4px;background:#1B1923;border:1px solid #34303F;border-radius:10px;padding:3px">
<button class="tab" aria-pressed="{{isLogin}}" onClick="{{toLogin}}">Logowanie</button>
<button class="tab" aria-pressed="{{isReg}}" onClick="{{toReg}}">Nowe konto</button>
</div>

<sc-if value="{{isLogin}}" hint-placeholder-val="{{ true }}">
<form style="margin-top:32px;display:flex;flex-direction:column;gap:18px">
<h1 style="margin:0;font-size:32px;line-height:1.1;font-weight:850;font-stretch:115%">Wróć do półki</h1>
<label style="font-size:14px;font-weight:600">Email<input class="fld" type="email" autocomplete="email" placeholder="jan@example.com"></label>
<label style="font-size:14px;font-weight:600">Hasło<input class="fld" type="password" autocomplete="current-password"></label>
<p role="alert" style="margin:0;color:#F0B08A;font-size:14px">{{err}}</p>
<button type="button" style="border:0;border-radius:10px;min-height:50px;background:#7FD8BE;color:#14231E;font-weight:750;cursor:pointer">Zaloguj się</button>
</form>
</sc-if>

<sc-if value="{{isReg}}" hint-placeholder-val="{{ false }}">
<form style="margin-top:32px;display:flex;flex-direction:column;gap:18px">
<h1 style="margin:0;font-size:32px;line-height:1.1;font-weight:850;font-stretch:115%">Załóż konto</h1>
<label style="font-size:14px;font-weight:600">Nazwa użytkownika<input class="fld" type="text" autocomplete="username"></label>
<label style="font-size:14px;font-weight:600">Email<input class="fld" type="email" autocomplete="email"></label>
<label style="font-size:14px;font-weight:600">Hasło<input class="fld" type="password" autocomplete="new-password"></label>
<button type="button" style="border:0;border-radius:10px;min-height:50px;background:#7FD8BE;color:#14231E;font-weight:750;cursor:pointer">Załóż konto</button>
<p style="margin:0;color:#A49DB2;font-size:13px">Konto istnieje tylko na tym serwerze. Grasz sam? Ustaw <span style="font-weight:700;color:#CFC8DB">AUTH_ENABLED=false</span> w .env i pomiń logowanie.</p>
</form>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showError":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
var P=[["#2A2140","#C9A04B"],["#2E2A22","#D7B55B"],["#C65B3E","#2E3B4E"],["#8E2B22","#E8DCC4"],["#B8232A","#141414"],["#3A2D6B","#E86A8E"],["#2E6B57","#E2403C"],["#15191E","#B83A2E"],["#DDE6F2","#2F6BD8"],["#F2E64A","#1C1C24"],["#8FBCE6","#4E8A3A"],["#F4A3C0","#2B2B6E"],["#E9ECEF","#1E3F8C"],["#2B2F4A","#C9474F"],["#E3D6BF","#8C2F39"],["#3E4A2F","#C8A24A"],["#F06A3B","#2A1F4E"],["#1F2A30","#D9D4C7"],["#3B1E3F","#7FD6A4"],["#20305A","#F08A3E"]];
var BAND=["#F2C14E","#F2C14E","#F2C14E","#7FD8BE","#8EA8FF","#F2C14E","#7FD8BE","#F2C14E","#8EA8FF","#F2C14E","#F0935A","#F2C14E","#8EA8FF","#7FD8BE","#7FD8BE","#F2C14E","#F28DBA","#8EA8FF","#8EA8FF","#F2C14E"];
var H=[200,186,166,200,166,186,200,186,166,200,186,200,166,186,200,186,166,200,186,166];
class Component extends DCLogic {
  constructor(p){super(p);this.state={tab:"login"};}
  renderVals(){
    var self=this, l=this.state.tab==="login";
    return {
      isLogin:l,isReg:!l,
      toLogin:function(){self.setState({tab:"login"});},
      toReg:function(){self.setState({tab:"reg"});},
      err:(this.props.showError??false)?"Email albo hasło się nie zgadzają. Sprawdź oba pola.":"",
      spines:P.map(function(c,i){return "flex:0 0 auto;width:"+(H[i]===166?40:46)+"px;height:"+H[i]+"px;border-radius:3px 3px 1px 1px;border-top:7px solid "+BAND[i]+";background:linear-gradient(90deg,"+c[0]+" 0 80%,"+c[1]+" 80% 100%)";})
    };
  }
}
</script>
</body>
</html>
