# Bazy do pracy lokalnej (make dev, make test). Niezależne od docker-compose.yml,
# nie potrzebują pliku .env i słuchają tylko na localhost.
name: gamelogg-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gamelogg
      POSTGRES_PASSWORD: gamelogg-dev
      POSTGRES_DB: gamelogg
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamelogg -d gamelogg"]
      interval: 2s
      timeout: 5s
      retries: 20

  # Baza testów integracyjnych: dane w tmpfs, znikają po zatrzymaniu kontenera.
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: gamelogg
      POSTGRES_PASSWORD: gamelogg-test
      POSTGRES_DB: gamelogg_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamelogg -d gamelogg_test"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  pgdata-dev:
